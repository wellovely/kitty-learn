# Lint, typecheck, tests, and a production-shaped Next build with dummy secrets.
# Continuous deployment: connect this GitHub repo in the Vercel dashboard (do not
# deploy from this workflow). Set project Root Directory to `apps/web` and add env
# vars there (see README «Production deploy»).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun --cwd apps/web run test
      - run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dummy_for_build
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_dummy_for_build
          OPENROUTER_API_KEY: sk-or-dummy-for-build
          DEEPGRAM_API_KEY: dg_dummy_for_build
          NEXT_PUBLIC_APP_URL: http://localhost:3000
